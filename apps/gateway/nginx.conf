events {
    worker_connections 1024;
}

http {
    # ==================== UPSTREAMS ====================
    upstream catalogo {
        least_conn;
        server uamishop-catalogo:8080;
    }

    upstream ventas {
        least_conn;
        server uamishop-ventas:8080;
    }

    upstream ordenes {
        least_conn;
        server uamishop-ordenes:8080;
    }

    # ==================== CONFIG GLOBAL ====================
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ==================== SERVER ====================
    server {
        listen 8080;

        # ==================== CORS GLOBAL ====================
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Accept" always;

        # Preflight
        if ($request_method = OPTIONS) {
            return 204;
        }

        # ==================== CATALOGO ====================
        # Prefijo completo: lista, detalle, estadísticas, imágenes, categorías, etc.
        location /v1/productos {
            proxy_pass http://catalogo;
        }

        location /v1/categorias {
            proxy_pass http://catalogo;
        }

        # ==================== VENTAS ====================
        location /v1/clientes {
            proxy_pass http://ventas;
        }

        location /v1/carritos {
            proxy_pass http://ventas;
        }

        # ==================== ORDENES ====================
        location /v1/ordenes {
            proxy_pass http://ordenes;
        }

        # ==================== OTROS ====================

        # Health check
        location = /health {
            add_header Content-Type text/plain;
            return 200 'OK - Gateway';
        }

        # Swagger docs
        location /docs {
            proxy_pass http://catalogo/api/docs;
        }

        # Root
        location = / {
            add_header Content-Type text/plain;
            return 200 'UAMI Shop Gateway';
        }
    }
}
    