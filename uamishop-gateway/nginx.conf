events {
    worker_connections 1024;
}

http {
    # Upstreams con múltiples instancias (balanceo de carga)
    upstream catalogo {
        least_conn;
        server uamishop-catalogo:8081;
    }
    
    upstream ventas {
        least_conn;
        server uamishop-ventas:8082;
    }
    
    upstream ordenes {
        least_conn;
        server uamishop-ordenes:8083;
    }

    # Health check - reintentar en caso de error
    proxy_connect_timeout 5s;
    proxy_next_upstream error timeout http_502 http_503 http_504;

    server {
        listen 8080;
        
        # Catalogo 
        location /v1/productos {
            proxy_pass http://catalogo/v1/productos;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /v1/categorias {
            proxy_pass http://catalogo/v1/categorias;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Ventas
        location /v1/carritos {
            proxy_pass http://ventas/v1/carritos;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Ordenes
        location /v1/ordenes {
            proxy_pass http://ordenes/v1/ordenes;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            return 200 'OK - Gateway';
            add_header Content-Type text/plain;
        }

        # Swagger docs - redirect a catalogo
        location /docs {
            proxy_pass http://catalogo/api/docs;
            proxy_set_header Host $host;
        }
    }
}
