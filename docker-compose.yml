name: uamishop-app

services:
  mysql:
    image: mysql:latest
    container_name: uamishop-mysql
    environment:
      MYSQL_DATABASE: uamishop
      MYSQL_USER: uamishop
      MYSQL_PASSWORD: uamishop
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3307:3306' # Mapea el puerto 3306 del contenedor al puerto 3307 en el host para evitar conflictos con MySQL local
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-proot']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  uamishop:
    image: diegouvazquezr/uamishop:latest
    container_name: uamishop
    ports:
      - '8080:8080'
    environment:
      PORT: 8080 # El puerto que la aplicación escucha dentro del contenedor
      NODE_ENV: mysql
      DB_HOST: mysql # Docker resuelve el nombre del servicio a la IP del contenedor de MySQL
      DB_PORT: 3306
      DB_DATABASE: uamishop
      DB_USERNAME: uamishop
      DB_PASSWORD: uamishop
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
