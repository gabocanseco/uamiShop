name: uamishop-app

services:
  mysql-uamishop:
    image: mysql:latest
    container_name: uamishop-mysql
    environment:
      MYSQL_USER: uamishop
      MYSQL_PASSWORD: uamishop
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3307:3306' # Mapea el puerto 3306 del contenedor al puerto 3308 en el host para evitar conflictos con MySQL local
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-proot']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  uamishop-catalogo:
    build:
      context: .
      dockerfile: apps/catalogo/Dockerfile
    image: uamishop-catalogo:latest
    container_name: uamishop-catalogo
    ports:
      - '8081:8080'
    environment:
      PORT: 8080
      NODE_ENV: mysql
      DB_HOST: mysql-uamishop
      DB_PORT: 3306
      DB_DATABASE: uamishop_catalogo
      DB_USERNAME: uamishop
      DB_PASSWORD: uamishop
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      mysql-uamishop:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  uamishop-ventas:
    build:
      context: .
      dockerfile: apps/ventas/Dockerfile
    image: uamishop-ventas:latest
    container_name: uamishop-ventas
    ports:
      - '8082:8080'
    environment:
      PORT: 8080
      NODE_ENV: mysql
      DB_HOST: mysql-uamishop
      DB_PORT: 3306
      DB_DATABASE: uamishop_ventas
      DB_USERNAME: uamishop
      DB_PASSWORD: uamishop
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      CATALOGO_SERVICE_URL: http://uamishop-catalogo:8080
    depends_on:
      mysql-uamishop:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  uamishop-ordenes:
    build:
      context: .
      dockerfile: apps/ordenes/Dockerfile
    image: uamishop-ordenes:latest
    container_name: uamishop-ordenes
    ports:
      - '8083:8080'
    environment:
      PORT: 8080
      NODE_ENV: mysql
      DB_HOST: mysql-uamishop
      DB_PORT: 3306
      DB_DATABASE: uamishop_ordenes
      DB_USERNAME: uamishop
      DB_PASSWORD: uamishop
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      VENTAS_SERVICE_URL: http://uamishop-ventas:8080
    depends_on:
      mysql-uamishop:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: uamishop-rabbitmq
    ports:
      - '5672:5672' # Puerto para la comunicación con RabbitMQ
      - '15672:15672' # Puerto para la interfaz de administración de RabbitMQ
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  uamishop-gateway:
    build:
      context: ./apps/gateway
      dockerfile: Dockerfile
    image: uamishop-gateway:latest
    container_name: uamishop-gateway
    ports:
      - '8080:8080'
    depends_on:
      uamishop-catalogo:
        condition: service_started
      uamishop-ventas:
        condition: service_started
      uamishop-ordenes:
        condition: service_started
    restart: unless-stopped

  karate-tests:
    build: ./tests-karate
    container_name: uamishop-karate
    environment:
      - KARATE_ENV=docker
    depends_on:
      - uamishop-gateway
    volumes:
      - ./tests-karate/target:/app/target
    profiles: ['test']

volumes:
  mysql_data:
